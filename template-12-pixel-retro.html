<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>学图分享 · 像素复古</title>
<style>
/* ===== 像素复古 — Pixel Retro ===== */
@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
:root {
  --font-pixel: 'Press Start 2P', monospace;
  --font-ui: 'Press Start 2P', 'Courier New', monospace;
  --bg: #1a1a2e; --surface: #16213e; --border: #533483;
  --text: #e0e0ff; --text-secondary: #9d9dcc;
  --accent: #e94560; --accent-hover: #ff6b81;
  --green: #0f3460; --gold: #f0c040;
  --pixel-size: 4px;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: var(--font-ui); min-height: 100vh; line-height: 2;
  background: var(--bg);
  background-image: linear-gradient(rgba(83,52,131,0.15) 1px, transparent 1px),
                    linear-gradient(90deg, rgba(83,52,131,0.15) 1px, transparent 1px);
  background-size: 32px 32px;
  color: var(--text);
  font-size: 10px;
  image-rendering: pixelated;
}
.disclaimer-overlay { position: fixed; inset: 0; z-index: 9999; background: var(--bg); display: flex; align-items: center; justify-content: center; }
.disclaimer-card {
  max-width: 460px; width: 90%; padding: 32px 28px; text-align: center;
  background: var(--surface); border: 4px solid var(--border);
  box-shadow: 8px 8px 0 #000;
}
.disclaimer-card h1 { font-family: var(--font-pixel); font-size: 12px; margin-bottom: 20px; color: var(--gold); text-shadow: 2px 2px 0 #000; }
.disclaimer-card .content { font-size: 8px; color: var(--text-secondary); line-height: 2.5; margin-bottom: 24px; padding: 16px; background: #0a0a1e; border: 2px solid var(--border); }
.disclaimer-btns { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
.btn { padding: 10px 20px; font-size: 8px; cursor: pointer; border: 3px solid; font-family: var(--font-pixel); transition: all 0.1s; text-transform: uppercase; }
.btn-primary { background: var(--accent); color: #fff; border-color: #fff; box-shadow: 4px 4px 0 #000; }
.btn-primary:hover { background: var(--accent-hover); transform: translate(-2px,-2px); box-shadow: 6px 6px 0 #000; }
.btn-ghost { background: var(--surface); color: var(--text-secondary); border-color: var(--border); }
.btn-ghost:hover { background: var(--green); color: #fff; }
.app-header { padding: 16px 20px; display: flex; align-items: center; justify-content: space-between; background: var(--surface); border-bottom: 4px solid var(--border); position: sticky; top: 0; z-index: 100; }
.app-header .logo { font-family: var(--font-pixel); font-size: 10px; color: var(--gold); text-shadow: 2px 2px 0 #000; display: flex; align-items: center; gap: 8px; }
.app-header .logo .pixel-dot { width: 12px; height: 12px; background: var(--accent); display: inline-block; image-rendering: pixelated; }
.back-btn { background: var(--surface); border: 3px solid var(--border); padding: 8px 14px; cursor: pointer; font-size: 7px; color: var(--text-secondary); font-family: var(--font-pixel); }
.back-btn:hover { background: var(--green); color: #fff; }
.page { display: none; max-width: 800px; margin: 0 auto; padding: 24px 16px; }
.page.active { display: block; }
.page-title { font-family: var(--font-pixel); font-size: 11px; margin-bottom: 8px; color: var(--gold); text-shadow: 2px 2px 0 #000; }
.page-subtitle { font-size: 7px; color: var(--text-secondary); margin-bottom: 20px; }
.subject-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
.subject-card {
  background: var(--surface); border: 3px solid var(--border); padding: 20px 16px; cursor: pointer;
  text-align: center; transition: all 0.1s; box-shadow: 4px 4px 0 #000;
}
.subject-card:hover { border-color: var(--accent); transform: translate(-2px,-2px); box-shadow: 6px 6px 0 #000; }
.subject-icon { width: 48px; height: 48px; border: 3px solid var(--border); display: flex; align-items: center; justify-content: center; font-size: 14px; margin: 0 auto 10px; font-family: var(--font-pixel); background: var(--green); color: var(--gold); }
.subject-name { font-size: 9px; font-family: var(--font-pixel); }
.period-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(60px, 1fr)); gap: 8px; }
.period-item {
  aspect-ratio: 1; background: var(--surface); border: 3px solid var(--border); display: flex; align-items: center; justify-content: center;
  cursor: pointer; font-size: 9px; transition: all 0.1s; font-family: var(--font-pixel); box-shadow: 3px 3px 0 #000;
}
.period-item:hover { background: var(--accent); color: #fff; border-color: #fff; }
.image-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; }
.image-grid img { width: 100%; aspect-ratio: 3/4; object-fit: cover; cursor: pointer; border: 3px solid var(--border); transition: transform 0.1s; image-rendering: auto; box-shadow: 4px 4px 0 #000; }
.image-grid img:hover { transform: scale(1.04); border-color: var(--gold); }
.no-images { text-align: center; padding: 60px 20px; color: var(--text-secondary); font-size: 8px; }
.lightbox { display: none; position: fixed; inset: 0; z-index: 9998; background: rgba(0,0,0,0.95); align-items: center; justify-content: center; cursor: pointer; }
.lightbox.active { display: flex; } .lightbox img { max-width: 92vw; max-height: 90vh; object-fit: contain; border: 4px solid #fff; image-rendering: auto; }
.lightbox-close { position: absolute; top: 16px; right: 16px; color: #fff; font-size: 16px; cursor: pointer; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; font-family: var(--font-pixel); }
.admin-entry { text-align: center; padding: 32px 16px; } .admin-entry a { color: var(--text-secondary); font-size: 7px; text-decoration: none; opacity: 0.5; } .admin-entry a:hover { opacity: 1; color: var(--gold); }
.admin-modal { display: none; position: fixed; inset: 0; z-index: 9997; background: rgba(0,0,0,0.7); align-items: center; justify-content: center; }
.admin-modal.active { display: flex; }
.admin-panel { background: var(--surface); border: 4px solid var(--border); box-shadow: 8px 8px 0 #000; padding: 28px; width: 90%; max-width: 460px; max-height: 85vh; overflow-y: auto; }
.admin-panel h2 { font-family: var(--font-pixel); font-size: 10px; margin-bottom: 20px; color: var(--gold); }
.admin-panel label { display: block; font-size: 7px; margin-bottom: 4px; color: var(--text-secondary); font-family: var(--font-pixel); }
.admin-panel select, .admin-panel input { width: 100%; padding: 10px; border: 3px solid var(--border); font-size: 8px; margin-bottom: 16px; font-family: var(--font-pixel); background: #0a0a1e; color: var(--text); }
.admin-images { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0; }
.admin-images .thumb { position: relative; width: 72px; height: 72px; overflow: hidden; border: 3px solid var(--border); }
.admin-images .thumb img { width: 100%; height: 100%; object-fit: cover; }
.admin-images .thumb .del { position: absolute; top: 2px; right: 2px; background: var(--accent); color: #fff; width: 18px; height: 18px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 8px; font-family: var(--font-pixel); }
.admin-login-err { color: var(--accent); font-size: 7px; margin-bottom: 12px; display: none; font-family: var(--font-pixel); }
</style>
</head>
<body>
<div class="disclaimer-overlay" id="dO"><div class="disclaimer-card"><h1>★ 免责声明 ★</h1><div class="content">[此处为免责声明内容]</div><div class="disclaimer-btns"><button class="btn btn-primary" onclick="A()">▶ 同意</button><button class="btn btn-ghost" onclick="D()">✕ 不同意</button></div></div></div>
<header class="app-header" id="aH" style="display:none"><div class="logo"><span class="pixel-dot"></span> 学图分享</div><button class="back-btn" id="bB" onclick="GB()" style="display:none">◀ 返回</button></header>
<main><div class="page active" id="pS"><h2 class="page-title">▼ 选择科目 ▼</h2><p class="page-subtitle">SELECT A SUBJECT</p><div class="subject-list" id="sL"></div></div>
<div class="page" id="pP"><h2 class="page-title" id="pT"></h2><p class="page-subtitle">SELECT PERIOD</p><div class="period-grid" id="pG"></div></div>
<div class="page" id="pI"><h2 class="page-title" id="iT"></h2><p class="page-subtitle">CLICK TO VIEW</p><div class="image-grid" id="iG"></div><div class="no-images" id="nI" style="display:none">NO IMAGES FOUND</div></div></main>
<div class="admin-entry"><a href="javascript:void(0)" onclick="OA()">[ ADMIN ]</a></div>
<div class="admin-modal" id="aLM"><div class="admin-panel"><h2>ADMIN LOGIN</h2><label>USER:</label><input type="text" id="aU" placeholder="admin"><label>PASS:</label><input type="password" id="aP" placeholder="123456"><p class="admin-login-err" id="aLE">ACCESS DENIED</p><button class="btn btn-primary" onclick="aL()" style="width:100%;margin-bottom:8px">LOGIN</button><button class="btn btn-ghost" onclick="cL()" style="width:100%">CANCEL</button></div></div>
<div class="admin-modal" id="aPM"><div class="admin-panel"><h2>IMAGE MANAGER</h2><label>SUBJECT:</label><select id="aS"></select><label>PERIOD:</label><input type="number" id="aPe" min="1" max="17" value="1"><button class="btn btn-primary" onclick="LA()" style="width:100%;margin-bottom:12px">VIEW IMAGES</button><label>UPLOAD:</label><input type="file" id="aF" accept="image/*" multiple onchange="UI()"><div class="admin-images" id="aI"></div><button class="btn btn-ghost" onclick="cP()" style="width:100%;margin-top:8px">CLOSE</button></div></div>
<div class="lightbox" id="lb" onclick="cLb()"><span class="lightbox-close">[X]</span><img id="lbI" src="" alt=""></div>
<script>const S=['语文','数学','英语','物理','化学','生物'],T=17,K='learning_share_images';let cs='',cp=0,st=[];function A(){localStorage.setItem('learning_share_agreed','1');document.getElementById('dO').style.display='none';document.getElementById('aH').style.display='flex';I();}function D(){alert('您必须同意免责声明才能使用本站。');}function SP(id){document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));document.getElementById(id).classList.add('active');}function GB(){if(st.length>0){let p=st.pop();if(p.page==='subjects'){SP('pS');document.getElementById('bB').style.display='none';}else SP('pP');}if(st.length===0)document.getElementById('bB').style.display='none';}function GIM(){try{return JSON.parse(localStorage.getItem(K))||{};}catch(e){return{};}}function SId(d){localStorage.setItem(K,JSON.stringify(d));}function GSI(s,p){let d=GIM();return d[s+'_'+p]||[];}function AIM(s,p,b){let d=GIM(),k=s+'_'+p;if(!d[k])d[k]=[];d[k].push(b);SId(d);}function RIM(s,p,i){let d=GIM(),k=s+'_'+p;if(d[k]){d[k].splice(i,1);if(!d[k].length)delete d[k];SId(d);}}function I(){document.getElementById('sL').innerHTML=S.map(s=>`<div class="subject-card" onclick="OS('${s}')"><div class="subject-icon">${s[0]}</div><div class="subject-name">${s}</div></div>`).join('');}function OS(s){cs=s;st.push({page:'subjects'});document.getElementById('bB').style.display='inline-block';document.getElementById('pT').textContent=s;SP('pP');IP();}function IP(){let h='';for(let i=1;i<=T;i++)h+=`<div class="period-item" onclick="OP(${i})">${String(i).padStart(2,'0')}</div>`;document.getElementById('pG').innerHTML=h;}function OP(p){cp=p;st.push({page:'periods'});document.getElementById('iT').textContent=cs+' · STAGE '+p;SP('pI');LI();}function LI(){let imgs=GSI(cs,cp),g=document.getElementById('iG'),n=document.getElementById('nI');if(!imgs.length){g.innerHTML='';n.style.display='block';}else{n.style.display='none';g.innerHTML=imgs.map((img,i)=>`<img src="${img}" onclick="event.stopPropagation();OL('${img}')">`).join('');}}function OL(src){document.getElementById('lbI').src=src;document.getElementById('lb').classList.add('active');}function cLb(){document.getElementById('lb').classList.remove('active');}function OA(){document.getElementById('aLM').classList.add('active');document.getElementById('aLE').style.display='none';}function cL(){document.getElementById('aLM').classList.remove('active');}function aL(){if(document.getElementById('aU').value.trim()==='admin'&&document.getElementById('aP').value.trim()==='123456'){cL();OPa();}else document.getElementById('aLE').style.display='block';}function OPa(){document.getElementById('aS').innerHTML=S.map(s=>`<option value="${s}">${s}</option>`).join('');document.getElementById('aPe').value=1;document.getElementById('aPM').classList.add('active');LA();}function cP(){document.getElementById('aPM').classList.remove('active');}function LA(){let s=document.getElementById('aS').value,p=parseInt(document.getElementById('aPe').value),imgs=GSI(s,p);document.getElementById('aI').innerHTML=imgs.map((img,i)=>`<div class="thumb"><img src="${img}"><span class="del" onclick="DA('${s}',${p},${i})">X</span></div>`).join('');if(s===cs&&p===cp)LI();}function DA(s,p,i){if(!confirm('确定删除？'))return;RIM(s,p,i);LA();}function UI(){let s=document.getElementById('aS').value,p=parseInt(document.getElementById('aPe').value),files=document.getElementById('aF').files,pr=0;for(let f of files){let r=new FileReader();r.onload=function(e){AIM(s,p,e.target.result);pr++;if(pr===files.length){LA();document.getElementById('aF').value='';}};r.readAsDataURL(f);}}document.addEventListener('keydown',e=>{if(e.key==='Escape'){cLb();cL();cP();}});if(localStorage.getItem('learning_share_agreed')==='1')A();</script>
</body>
</html>
