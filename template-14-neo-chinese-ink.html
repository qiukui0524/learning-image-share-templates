<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>学图分享 · 新中式水墨</title>
<style>
/* ===== 新中式水墨 — Neo-Chinese Ink ===== */
@import url('https://fonts.googleapis.com/css2?family=ZCOOL+XiaoWei&family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@300;400;600;700&display=swap');
:root {
  --font-brush: 'Ma Shan Zheng', 'ZCOOL XiaoWei', cursive;
  --font-title: 'ZCOOL XiaoWei', 'Noto Serif SC', serif;
  --font-body: 'Noto Serif SC', 'STSong', 'SimSun', serif;
  --bg: #f8f4ed; --surface: #fefcf7; --border: #d4c8b0;
  --text: #3d3226; --text-secondary: #8c7b65;
  --accent: #b8413b; --gold: #c9a45c;
  --ink: #2c2416;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: var(--font-body); min-height: 100vh; line-height: 2; background: var(--bg); color: var(--text); }
body::before {
  content: ''; position: fixed; inset: 0;
  background: radial-gradient(ellipse at 20% 20%, rgba(180,160,130,0.08) 0%, transparent 50%),
              radial-gradient(ellipse at 80% 80%, rgba(180,160,130,0.06) 0%, transparent 50%);
  pointer-events: none; z-index: 0;
}
.disclaimer-overlay { position: fixed; inset: 0; z-index: 9999; background: var(--bg); display: flex; align-items: center; justify-content: center; }
.disclaimer-card {
  max-width: 480px; width: 90%; padding: 52px 40px; text-align: center;
  background: var(--surface); border: 1px solid var(--border);
  position: relative;
}
.disclaimer-card::before { content: ''; position: absolute; top: 12px; left: 12px; right: 12px; bottom: 12px; border: 1px solid var(--border); pointer-events: none; opacity: 0.6; }
.disclaimer-card h1 { font-family: var(--font-brush); font-size: 2.5rem; margin-bottom: 20px; color: var(--ink); }
.disclaimer-card .content { font-size: 0.9rem; color: var(--text-secondary); line-height: 2.2; margin-bottom: 28px; padding: 24px; background: var(--bg); font-family: var(--font-body); }
.disclaimer-btns { display: flex; gap: 16px; justify-content: center; }
.btn { padding: 10px 36px; font-size: 1rem; cursor: pointer; border: none; font-family: var(--font-title); transition: all 0.3s; letter-spacing: 0.1em; }
.btn-primary { background: var(--accent); color: #fefcf7; }
.btn-primary:hover { background: #9a3530; }
.btn-ghost { background: transparent; border: 1px solid var(--border); color: var(--text-secondary); }
.btn-ghost:hover { background: var(--bg); }
.app-header { padding: 20px 32px; display: flex; align-items: center; justify-content: space-between; background: var(--surface); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 100; }
.app-header .logo { font-family: var(--font-brush); font-size: 1.8rem; color: var(--ink); }
.app-header .logo .seal { display: inline-block; width: 28px; height: 28px; background: var(--accent); color: #fff; font-size: 0.7rem; line-height: 28px; text-align: center; border-radius: 2px; margin-right: 8px; font-family: var(--font-body); }
.back-btn { background: none; border: none; padding: 6px 0; cursor: pointer; font-size: 0.9rem; color: var(--text-secondary); font-family: var(--font-title); letter-spacing: 0.06em; }
.back-btn:hover { color: var(--accent); }
.page { display: none; max-width: 780px; margin: 0 auto; padding: 40px 24px; position: relative; z-index: 1; }
.page.active { display: block; }
.page-title { font-family: var(--font-brush); font-size: 2.2rem; margin-bottom: 8px; color: var(--ink); }
.page-subtitle { color: var(--text-secondary); font-size: 0.9rem; margin-bottom: 32px; font-family: var(--font-title); letter-spacing: 0.06em; }
.subject-list { display: flex; flex-direction: column; gap: 0; border: 1px solid var(--border); }
.subject-card {
  background: var(--surface); padding: 20px 24px; cursor: pointer;
  display: flex; align-items: center; gap: 16px; transition: all 0.3s;
  border-bottom: 1px solid var(--border);
}
.subject-card:last-child { border-bottom: none; }
.subject-card:hover { background: #fdf5ef; }
.subject-icon { width: 44px; height: 44px; border: 2px solid var(--accent); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; color: var(--accent); flex-shrink: 0; font-family: var(--font-brush); }
.subject-name { font-size: 1.1rem; font-family: var(--font-title); letter-spacing: 0.08em; }
.subject-arrow { margin-left: auto; color: var(--border); font-size: 1.2rem; }
.period-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(72px, 1fr)); gap: 10px; }
.period-item {
  aspect-ratio: 1; background: var(--surface); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center;
  cursor: pointer; font-size: 1.1rem; font-family: var(--font-title); transition: all 0.3s;
}
.period-item:hover { background: var(--accent); color: #fff; border-color: var(--accent); }
.image-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px; }
.image-grid img { width: 100%; aspect-ratio: 3/4; object-fit: cover; cursor: pointer; transition: all 0.3s; border: 4px solid var(--surface); box-shadow: 0 2px 12px rgba(0,0,0,0.06); }
.image-grid img:hover { border-color: var(--accent); transform: scale(1.03); }
.no-images { text-align: center; padding: 60px 20px; color: var(--text-secondary); font-family: var(--font-brush); font-size: 1.2rem; }
.lightbox { display: none; position: fixed; inset: 0; z-index: 9998; background: rgba(28,22,16,0.94); align-items: center; justify-content: center; cursor: pointer; }
.lightbox.active { display: flex; } .lightbox img { max-width: 92vw; max-height: 90vh; object-fit: contain; border: 8px solid var(--surface); }
.lightbox-close { position: absolute; top: 24px; right: 24px; color: #fff; font-size: 2rem; cursor: pointer; width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; font-family: var(--font-brush); }
.admin-entry { text-align: center; padding: 48px 20px; } .admin-entry a { color: var(--text-secondary); font-size: 0.8rem; text-decoration: none; opacity: 0.4; } .admin-entry a:hover { opacity: 1; }
.admin-modal { display: none; position: fixed; inset: 0; z-index: 9997; background: rgba(28,22,16,0.4); align-items: center; justify-content: center; }
.admin-modal.active { display: flex; }
.admin-panel { background: var(--surface); border: 1px solid var(--border); padding: 36px; width: 90%; max-width: 480px; max-height: 85vh; overflow-y: auto; }
.admin-panel h2 { font-family: var(--font-brush); font-size: 1.8rem; margin-bottom: 24px; color: var(--ink); }
.admin-panel label { display: block; font-size: 0.85rem; margin-bottom: 4px; color: var(--text-secondary); font-family: var(--font-title); }
.admin-panel select, .admin-panel input { width: 100%; padding: 10px 14px; border: 1px solid var(--border); font-size: 0.9rem; margin-bottom: 20px; font-family: var(--font-body); background: var(--bg); color: var(--text); }
.admin-images { display: flex; flex-wrap: wrap; gap: 8px; margin: 16px 0; }
.admin-images .thumb { position: relative; width: 76px; height: 76px; overflow: hidden; border: 2px solid var(--border); }
.admin-images .thumb img { width: 100%; height: 100%; object-fit: cover; }
.admin-images .thumb .del { position: absolute; top: 2px; right: 2px; background: var(--accent); color: #fff; width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 0.7rem; }
.admin-login-err { color: var(--accent); font-size: 0.85rem; margin-bottom: 12px; display: none; }
</style>
</head>
<body>
<div class="disclaimer-overlay" id="dO"><div class="disclaimer-card"><h1>免责声明</h1><div class="content">[此处为免责声明内容]</div><div class="disclaimer-btns"><button class="btn btn-primary" onclick="A()">同 意</button><button class="btn btn-ghost" onclick="D()">不同意</button></div></div></div>
<header class="app-header" id="aH" style="display:none"><div class="logo"><span class="seal">印</span>学图分享</div><button class="back-btn" id="bB" onclick="GB()" style="display:none">← 返回</button></header>
<main><div class="page active" id="pS"><h2 class="page-title">科 目</h2><p class="page-subtitle">择一科，观其图</p><div class="subject-list" id="sL"></div></div>
<div class="page" id="pP"><h2 class="page-title" id="pT"></h2><p class="page-subtitle">选一期阅览</p><div class="period-grid" id="pG"></div></div>
<div class="page" id="pI"><h2 class="page-title" id="iT"></h2><p class="page-subtitle">轻点图片，以观全貌</p><div class="image-grid" id="iG"></div><div class="no-images" id="nI" style="display:none">此处尚无画卷</div></div></main>
<div class="admin-entry"><a href="javascript:void(0)" onclick="OA()">管 理</a></div>
<div class="admin-modal" id="aLM"><div class="admin-panel"><h2>管理员登录</h2><label>用户名</label><input type="text" id="aU" placeholder="admin"><label>密码</label><input type="password" id="aP" placeholder="123456"><p class="admin-login-err" id="aLE">用户名或密码错误</p><button class="btn btn-primary" onclick="aL()" style="width:100%;margin-bottom:8px">登录</button><button class="btn btn-ghost" onclick="cL()" style="width:100%">取消</button></div></div>
<div class="admin-modal" id="aPM"><div class="admin-panel"><h2>图片管理</h2><label>科目</label><select id="aS"></select><label>期数</label><input type="number" id="aPe" min="1" max="17" value="1"><button class="btn btn-primary" onclick="LA()" style="width:100%;margin-bottom:12px">查看图片</button><label>上传图片</label><input type="file" id="aF" accept="image/*" multiple onchange="UI()"><div class="admin-images" id="aI"></div><button class="btn btn-ghost" onclick="cP()" style="width:100%;margin-top:8px">关闭</button></div></div>
<div class="lightbox" id="lb" onclick="cLb()"><span class="lightbox-close">✕</span><img id="lbI" src="" alt=""></div>
<script>const S=['语文','数学','英语','物理','化学','生物'],T=17,K='learning_share_images';let cs='',cp=0,st=[];function A(){localStorage.setItem('learning_share_agreed','1');document.getElementById('dO').style.display='none';document.getElementById('aH').style.display='flex';I();}function D(){alert('您必须同意免责声明才能使用本站。');}function SP(id){document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));document.getElementById(id).classList.add('active');}function GB(){if(st.length>0){let p=st.pop();if(p.page==='subjects'){SP('pS');document.getElementById('bB').style.display='none';}else SP('pP');}if(st.length===0)document.getElementById('bB').style.display='none';}function GIM(){try{return JSON.parse(localStorage.getItem(K))||{};}catch(e){return{};}}function SId(d){localStorage.setItem(K,JSON.stringify(d));}function GSI(s,p){let d=GIM();return d[s+'_'+p]||[];}function AIM(s,p,b){let d=GIM(),k=s+'_'+p;if(!d[k])d[k]=[];d[k].push(b);SId(d);}function RIM(s,p,i){let d=GIM(),k=s+'_'+p;if(d[k]){d[k].splice(i,1);if(!d[k].length)delete d[k];SId(d);}}function I(){document.getElementById('sL').innerHTML=S.map(s=>`<div class="subject-card" onclick="OS('${s}')"><div class="subject-icon">${s[0]}</div><span class="subject-name">${s}</span><span class="subject-arrow">〉</span></div>`).join('');}function OS(s){cs=s;st.push({page:'subjects'});document.getElementById('bB').style.display='inline-block';document.getElementById('pT').textContent=s;SP('pP');IP();}function IP(){let h='';for(let i=1;i<=T;i++)h+=`<div class="period-item" onclick="OP(${i})">${i}</div>`;document.getElementById('pG').innerHTML=h;}function OP(p){cp=p;st.push({page:'periods'});document.getElementById('iT').textContent=cs+' · 第 '+p+' 期';SP('pI');LI();}function LI(){let imgs=GSI(cs,cp),g=document.getElementById('iG'),n=document.getElementById('nI');if(!imgs.length){g.innerHTML='';n.style.display='block';}else{n.style.display='none';g.innerHTML=imgs.map((img,i)=>`<img src="${img}" onclick="event.stopPropagation();OL('${img}')">`).join('');}}function OL(src){document.getElementById('lbI').src=src;document.getElementById('lb').classList.add('active');}function cLb(){document.getElementById('lb').classList.remove('active');}function OA(){document.getElementById('aLM').classList.add('active');document.getElementById('aLE').style.display='none';}function cL(){document.getElementById('aLM').classList.remove('active');}function aL(){if(document.getElementById('aU').value.trim()==='admin'&&document.getElementById('aP').value.trim()==='123456'){cL();OPa();}else document.getElementById('aLE').style.display='block';}function OPa(){document.getElementById('aS').innerHTML=S.map(s=>`<option value="${s}">${s}</option>`).join('');document.getElementById('aPe').value=1;document.getElementById('aPM').classList.add('active');LA();}function cP(){document.getElementById('aPM').classList.remove('active');}function LA(){let s=document.getElementById('aS').value,p=parseInt(document.getElementById('aPe').value),imgs=GSI(s,p);document.getElementById('aI').innerHTML=imgs.map((img,i)=>`<div class="thumb"><img src="${img}"><span class="del" onclick="DA('${s}',${p},${i})">×</span></div>`).join('');if(s===cs&&p===cp)LI();}function DA(s,p,i){if(!confirm('确定删除？'))return;RIM(s,p,i);LA();}function UI(){let s=document.getElementById('aS').value,p=parseInt(document.getElementById('aPe').value),files=document.getElementById('aF').files,pr=0;for(let f of files){let r=new FileReader();r.onload=function(e){AIM(s,p,e.target.result);pr++;if(pr===files.length){LA();document.getElementById('aF').value='';}};r.readAsDataURL(f);}}document.addEventListener('keydown',e=>{if(e.key==='Escape'){cLb();cL();cP();}});if(localStorage.getItem('learning_share_agreed')==='1')A();</script>
</body>
</html>
