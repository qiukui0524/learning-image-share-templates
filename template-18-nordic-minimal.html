<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>学图分享 · 北欧极简</title>
<style>
/* ===== 北欧极简 — Nordic Minimal ===== */
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
:root {
  --font: 'Inter', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  --bg: #f4f6f9; --surface: #ffffff; --border: #e2e6ed;
  --text: #1a1d23; --text-secondary: #8892a0;
  --accent: #4f6f8f; --accent-hover: #3d5a75;
  --radius: 6px;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: var(--font); min-height: 100vh; line-height: 1.6; background: var(--bg); color: var(--text); font-weight: 400; }
.disclaimer-overlay { position: fixed; inset: 0; z-index: 9999; background: var(--bg); display: flex; align-items: center; justify-content: center; }
.disclaimer-card { max-width: 480px; width: 90%; padding: 44px 36px; text-align: left; background: var(--surface); border: 1px solid var(--border); }
.disclaimer-card h1 { font-size: 1.3rem; font-weight: 600; margin-bottom: 20px; color: var(--text); text-transform: uppercase; letter-spacing: 0.06em; }
.disclaimer-card .content { font-size: 0.88rem; color: var(--text-secondary); line-height: 1.7; margin-bottom: 32px; padding: 20px; background: var(--bg); }
.disclaimer-btns { display: flex; gap: 10px; }
.btn { padding: 10px 28px; font-size: 0.85rem; cursor: pointer; border: none; font-family: var(--font); transition: all 0.2s; font-weight: 500; }
.btn-primary { background: var(--accent); color: #fff; }
.btn-primary:hover { background: var(--accent-hover); }
.btn-ghost { background: transparent; border: 1px solid var(--border); color: var(--text-secondary); }
.btn-ghost:hover { background: var(--bg); }
.app-header { padding: 14px 28px; display: flex; align-items: center; justify-content: space-between; background: var(--surface); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 100; }
.app-header .logo { font-size: 1rem; font-weight: 600; color: var(--text); text-transform: uppercase; letter-spacing: 0.08em; }
.back-btn { background: none; border: none; padding: 4px 0; cursor: pointer; font-size: 0.85rem; color: var(--text-secondary); font-family: var(--font); }
.back-btn:hover { color: var(--accent); }
.page { display: none; max-width: 860px; margin: 0 auto; padding: 36px 24px; }
.page.active { display: block; }
.page-title { font-size: 1.4rem; margin-bottom: 4px; font-weight: 600; }
.page-subtitle { color: var(--text-secondary); font-size: 0.85rem; margin-bottom: 32px; }
.subject-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
.subject-card { background: var(--surface); border: 1px solid var(--border); padding: 24px 20px; cursor: pointer; display: flex; align-items: center; gap: 14px; transition: all 0.2s; }
.subject-card:hover { border-color: var(--accent); }
.subject-icon { width: 40px; height: 40px; background: var(--bg); display: flex; align-items: center; justify-content: center; font-size: 1rem; font-weight: 600; color: var(--accent); flex-shrink: 0; }
.subject-name { font-size: 0.95rem; font-weight: 500; } .subject-arrow { margin-left: auto; color: var(--text-secondary); }
.period-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(64px, 1fr)); gap: 8px; }
.period-item { aspect-ratio: 1; background: var(--surface); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 0.95rem; font-weight: 500; transition: all 0.2s; }
.period-item:hover { background: var(--accent); color: #fff; border-color: var(--accent); }
.image-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
.image-grid img { width: 100%; aspect-ratio: 1; object-fit: cover; cursor: pointer; transition: opacity 0.2s; }
.image-grid img:hover { opacity: 0.85; }
.no-images { text-align: center; padding: 60px 20px; color: var(--text-secondary); }
.lightbox { display: none; position: fixed; inset: 0; z-index: 9998; background: rgba(20,22,28,0.94); align-items: center; justify-content: center; cursor: pointer; }
.lightbox.active { display: flex; } .lightbox img { max-width: 90vw; max-height: 88vh; object-fit: contain; }
.lightbox-close { position: absolute; top: 20px; right: 20px; color: #fff; font-size: 1.8rem; cursor: pointer; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; }
.admin-entry { text-align: center; padding: 40px 20px; } .admin-entry a { color: var(--text-secondary); font-size: 0.75rem; text-decoration: none; opacity: 0.4; } .admin-entry a:hover { opacity: 1; }
.admin-modal { display: none; position: fixed; inset: 0; z-index: 9997; background: rgba(20,22,28,0.4); align-items: center; justify-content: center; }
.admin-modal.active { display: flex; }
.admin-panel { background: var(--surface); border: 1px solid var(--border); padding: 32px; width: 90%; max-width: 480px; max-height: 85vh; overflow-y: auto; }
.admin-panel h2 { font-size: 1.1rem; font-weight: 600; margin-bottom: 20px; text-transform: uppercase; letter-spacing: 0.06em; }
.admin-panel label { display: block; font-size: 0.8rem; margin-bottom: 4px; color: var(--text-secondary); }
.admin-panel select, .admin-panel input { width: 100%; padding: 9px 12px; border: 1px solid var(--border); font-size: 0.88rem; margin-bottom: 18px; font-family: var(--font); background: var(--bg); color: var(--text); }
.admin-images { display: flex; flex-wrap: wrap; gap: 6px; margin: 12px 0; }
.admin-images .thumb { position: relative; width: 72px; height: 72px; overflow: hidden; border: 1px solid var(--border); }
.admin-images .thumb img { width: 100%; height: 100%; object-fit: cover; }
.admin-images .thumb .del { position: absolute; top: 2px; right: 2px; background: #c44; color: #fff; width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 0.7rem; }
.admin-login-err { color: #c44; font-size: 0.8rem; margin-bottom: 12px; display: none; }
</style>
</head>
<body>
<div class="disclaimer-overlay" id="dO"><div class="disclaimer-card"><h1>Disclaimer</h1><div class="content">[此处为免责声明内容]</div><div class="disclaimer-btns"><button class="btn btn-primary" onclick="A()">同意</button><button class="btn btn-ghost" onclick="D()">不同意</button></div></div></div>
<header class="app-header" id="aH" style="display:none"><div class="logo">Study Share</div><button class="back-btn" id="bB" onclick="GB()" style="display:none">← Back</button></header>
<main><div class="page active" id="pS"><h2 class="page-title">Subjects</h2><p class="page-subtitle">Select a subject to browse</p><div class="subject-list" id="sL"></div></div>
<div class="page" id="pP"><h2 class="page-title" id="pT"></h2><p class="page-subtitle">Select a period</p><div class="period-grid" id="pG"></div></div>
<div class="page" id="pI"><h2 class="page-title" id="iT"></h2><p class="page-subtitle">Click image to enlarge</p><div class="image-grid" id="iG"></div><div class="no-images" id="nI" style="display:none">No images yet</div></div></main>
<div class="admin-entry"><a href="javascript:void(0)" onclick="OA()">Admin</a></div>
<div class="admin-modal" id="aLM"><div class="admin-panel"><h2>Admin Login</h2><label>Username</label><input type="text" id="aU" placeholder="admin"><label>Password</label><input type="password" id="aP" placeholder="123456"><p class="admin-login-err" id="aLE">Invalid credentials</p><button class="btn btn-primary" onclick="aL()" style="width:100%;margin-bottom:8px">Login</button><button class="btn btn-ghost" onclick="cL()" style="width:100%">Cancel</button></div></div>
<div class="admin-modal" id="aPM"><div class="admin-panel"><h2>Image Manager</h2><label>Subject</label><select id="aS"></select><label>Period</label><input type="number" id="aPe" min="1" max="17" value="1"><button class="btn btn-primary" onclick="LA()" style="width:100%;margin-bottom:12px">View</button><label>Upload</label><input type="file" id="aF" accept="image/*" multiple onchange="UI()"><div class="admin-images" id="aI"></div><button class="btn btn-ghost" onclick="cP()" style="width:100%;margin-top:8px">Close</button></div></div>
<div class="lightbox" id="lb" onclick="cLb()"><span class="lightbox-close">×</span><img id="lbI" src="" alt=""></div>
<script>const S=['语文','数学','英语','物理','化学','生物'],T=17,K='learning_share_images';let cs='',cp=0,st=[];function A(){localStorage.setItem('learning_share_agreed','1');document.getElementById('dO').style.display='none';document.getElementById('aH').style.display='flex';I();}function D(){alert('您必须同意免责声明才能使用本站。');}function SP(id){document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));document.getElementById(id).classList.add('active');}function GB(){if(st.length>0){let p=st.pop();if(p.page==='subjects'){SP('pS');document.getElementById('bB').style.display='none';}else SP('pP');}if(st.length===0)document.getElementById('bB').style.display='none';}function GIM(){try{return JSON.parse(localStorage.getItem(K))||{};}catch(e){return{};}}function SId(d){localStorage.setItem(K,JSON.stringify(d));}function GSI(s,p){let d=GIM();return d[s+'_'+p]||[];}function AIM(s,p,b){let d=GIM(),k=s+'_'+p;if(!d[k])d[k]=[];d[k].push(b);SId(d);}function RIM(s,p,i){let d=GIM(),k=s+'_'+p;if(d[k]){d[k].splice(i,1);if(!d[k].length)delete d[k];SId(d);}}function I(){document.getElementById('sL').innerHTML=S.map(s=>`<div class="subject-card" onclick="OS('${s}')"><div class="subject-icon">${s[0]}</div><span class="subject-name">${s}</span><span class="subject-arrow">→</span></div>`).join('');}function OS(s){cs=s;st.push({page:'subjects'});document.getElementById('bB').style.display='inline-block';document.getElementById('pT').textContent=s;SP('pP');IP();}function IP(){let h='';for(let i=1;i<=T;i++)h+=`<div class="period-item" onclick="OP(${i})">${i}</div>`;document.getElementById('pG').innerHTML=h;}function OP(p){cp=p;st.push({page:'periods'});document.getElementById('iT').textContent=cs+' · Period '+p;SP('pI');LI();}function LI(){let imgs=GSI(cs,cp),g=document.getElementById('iG'),n=document.getElementById('nI');if(!imgs.length){g.innerHTML='';n.style.display='block';}else{n.style.display='none';g.innerHTML=imgs.map((img,i)=>`<img src="${img}" onclick="event.stopPropagation();OL('${img}')">`).join('');}}function OL(src){document.getElementById('lbI').src=src;document.getElementById('lb').classList.add('active');}function cLb(){document.getElementById('lb').classList.remove('active');}function OA(){document.getElementById('aLM').classList.add('active');document.getElementById('aLE').style.display='none';}function cL(){document.getElementById('aLM').classList.remove('active');}function aL(){if(document.getElementById('aU').value.trim()==='admin'&&document.getElementById('aP').value.trim()==='123456'){cL();OPa();}else document.getElementById('aLE').style.display='block';}function OPa(){document.getElementById('aS').innerHTML=S.map(s=>`<option value="${s}">${s}</option>`).join('');document.getElementById('aPe').value=1;document.getElementById('aPM').classList.add('active');LA();}function cP(){document.getElementById('aPM').classList.remove('active');}function LA(){let s=document.getElementById('aS').value,p=parseInt(document.getElementById('aPe').value),imgs=GSI(s,p);document.getElementById('aI').innerHTML=imgs.map((img,i)=>`<div class="thumb"><img src="${img}"><span class="del" onclick="DA('${s}',${p},${i})">×</span></div>`).join('');if(s===cs&&p===cp)LI();}function DA(s,p,i){if(!confirm('确定删除？'))return;RIM(s,p,i);LA();}function UI(){let s=document.getElementById('aS').value,p=parseInt(document.getElementById('aPe').value),files=document.getElementById('aF').files,pr=0;for(let f of files){let r=new FileReader();r.onload=function(e){AIM(s,p,e.target.result);pr++;if(pr===files.length){LA();document.getElementById('aF').value='';}};r.readAsDataURL(f);}}document.addEventListener('keydown',e=>{if(e.key==='Escape'){cLb();cL();cP();}});if(localStorage.getItem('learning_share_agreed')==='1')A();</script>
</body>
</html>
