<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>学图分享 · 海洋微风</title>
<style>
/* ===== 海洋微风 — Ocean Breeze ===== */
@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap');
:root {
  --font: 'Plus Jakarta Sans', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  --bg: #f0f6fa; --surface: #ffffff;
  --text: #1e3a4d; --text-secondary: #6b8a9e;
  --accent: #3b9bc9; --accent-hover: #2d7da8;
  --wave1: #d4eaf7; --wave2: #c0e0f4; --wave3: #e8f4fb;
  --coral: #f08080; --sand: #f5e6d3;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: var(--font); min-height: 100vh; line-height: 1.7; background: var(--bg); color: var(--text); font-weight: 400; }
body::before {
  content: ''; position: fixed; bottom: 0; left: 0; right: 0; height: 180px; z-index: 0; pointer-events: none;
  background: url("data:image/svg+xml,%3Csvg width='1200' height='180' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M0 120 Q150 80 300 110 Q450 140 600 100 Q750 60 900 105 Q1050 150 1200 110 L1200 180 L0 180Z' fill='%23d4eaf7' opacity='0.6'/%3E%3Cpath d='M0 140 Q200 110 400 135 Q600 160 800 125 Q1000 90 1200 130 L1200 180 L0 180Z' fill='%23c0e0f4' opacity='0.4'/%3E%3C/svg%3E") repeat-x bottom;
}
.disclaimer-overlay { position: fixed; inset: 0; z-index: 9999; background: linear-gradient(180deg, #e8f4fb, #f0f6fa); display: flex; align-items: center; justify-content: center; }
.disclaimer-card {
  max-width: 460px; width: 90%; padding: 44px 32px; text-align: center;
  background: var(--surface); border-radius: 24px;
  box-shadow: 0 4px 24px rgba(59,155,201,0.1);
  border: 1px solid rgba(59,155,201,0.12);
}
.disclaimer-card h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: 16px; color: #1e5a7a; }
.disclaimer-card .content { font-size: 0.9rem; color: var(--text-secondary); margin-bottom: 28px; padding: 20px; background: var(--wave3); border-radius: 16px; }
.disclaimer-btns { display: flex; gap: 10px; justify-content: center; }
.btn { padding: 10px 30px; border-radius: 12px; font-size: 0.9rem; cursor: pointer; border: none; font-family: var(--font); transition: all 0.3s; font-weight: 600; }
.btn-primary { background: var(--accent); color: #fff; }
.btn-primary:hover { background: var(--accent-hover); transform: translateY(-2px); box-shadow: 0 6px 18px rgba(59,155,201,0.25); }
.btn-ghost { background: var(--wave3); color: var(--text-secondary); }
.btn-ghost:hover { background: var(--wave1); }
.app-header { padding: 16px 24px; display: flex; align-items: center; justify-content: space-between; background: rgba(255,255,255,0.85); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(59,155,201,0.1); position: sticky; top: 0; z-index: 100; }
.app-header .logo { font-size: 1.2rem; font-weight: 700; color: #1e5a7a; display: flex; align-items: center; gap: 6px; }
.back-btn { background: var(--wave3); border: none; padding: 6px 16px; border-radius: 10px; cursor: pointer; font-size: 0.85rem; color: var(--text-secondary); font-family: var(--font); font-weight: 500; }
.back-btn:hover { background: var(--wave1); }
.page { display: none; max-width: 840px; margin: 0 auto; padding: 32px 20px; position: relative; z-index: 1; }
.page.active { display: block; }
.page-title { font-size: 1.6rem; margin-bottom: 4px; font-weight: 700; color: #1e5a7a; }
.page-subtitle { color: var(--text-secondary); font-size: 0.9rem; margin-bottom: 28px; }
.subject-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 14px; }
.subject-card {
  background: var(--surface); border-radius: 18px; padding: 22px 18px; cursor: pointer;
  text-align: center; transition: all 0.3s; border: 1px solid rgba(59,155,201,0.08);
  box-shadow: 0 2px 12px rgba(59,155,201,0.04);
}
.subject-card:hover { border-color: var(--accent); transform: translateY(-4px); box-shadow: 0 8px 28px rgba(59,155,201,0.12); }
.subject-icon { width: 52px; height: 52px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.3rem; font-weight: 700; margin: 0 auto 10px; color: #fff; }
.subject-card:nth-child(1) .subject-icon { background: linear-gradient(135deg, #3b9bc9, #5bb8e0); }
.subject-card:nth-child(2) .subject-icon { background: linear-gradient(135deg, #5bb8a0, #7cd0b8); }
.subject-card:nth-child(3) .subject-icon { background: linear-gradient(135deg, #e0a060, #f0c080); }
.subject-card:nth-child(4) .subject-icon { background: linear-gradient(135deg, #9078c8, #b098e0); }
.subject-card:nth-child(5) .subject-icon { background: linear-gradient(135deg, #e07080, #f090a0); }
.subject-card:nth-child(6) .subject-icon { background: linear-gradient(135deg, #68a8c8, #88c0e0); }
.subject-name { font-size: 1.05rem; font-weight: 600; }
.period-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(70px, 1fr)); gap: 10px; }
.period-item {
  aspect-ratio: 1; background: var(--surface); border-radius: 14px; display: flex; align-items: center; justify-content: center;
  cursor: pointer; font-size: 1rem; font-weight: 600; transition: all 0.3s;
  border: 1px solid rgba(59,155,201,0.1); box-shadow: 0 2px 8px rgba(59,155,201,0.04);
}
.period-item:hover { background: var(--accent); color: #fff; transform: scale(1.08); }
.image-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px; }
.image-grid img { width: 100%; aspect-ratio: 3/4; object-fit: cover; border-radius: 16px; cursor: pointer; transition: transform 0.3s, box-shadow 0.3s; box-shadow: 0 4px 16px rgba(59,155,201,0.1); }
.image-grid img:hover { transform: scale(1.04); box-shadow: 0 8px 28px rgba(59,155,201,0.18); }
.no-images { text-align: center; padding: 60px 20px; color: var(--text-secondary); }
.lightbox { display: none; position: fixed; inset: 0; z-index: 9998; background: rgba(20,40,55,0.93); align-items: center; justify-content: center; cursor: pointer; }
.lightbox.active { display: flex; } .lightbox img { max-width: 92vw; max-height: 90vh; border-radius: 12px; object-fit: contain; }
.lightbox-close { position: absolute; top: 20px; right: 20px; color: #fff; font-size: 2rem; cursor: pointer; width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; }
.admin-entry { text-align: center; padding: 44px 20px; } .admin-entry a { color: var(--text-secondary); font-size: 0.8rem; text-decoration: none; opacity: 0.5; } .admin-entry a:hover { opacity: 1; }
.admin-modal { display: none; position: fixed; inset: 0; z-index: 9997; background: rgba(20,40,55,0.3); align-items: center; justify-content: center; }
.admin-modal.active { display: flex; }
.admin-panel { background: var(--surface); border-radius: 24px; padding: 32px; width: 90%; max-width: 480px; max-height: 85vh; overflow-y: auto; box-shadow: 0 8px 40px rgba(59,155,201,0.12); border: 1px solid rgba(59,155,201,0.1); }
.admin-panel h2 { font-size: 1.2rem; font-weight: 700; margin-bottom: 20px; color: #1e5a7a; }
.admin-panel label { display: block; font-size: 0.85rem; margin-bottom: 4px; color: var(--text-secondary); }
.admin-panel select, .admin-panel input { width: 100%; padding: 10px 14px; border: 1px solid rgba(59,155,201,0.15); border-radius: 10px; font-size: 0.9rem; margin-bottom: 16px; font-family: var(--font); background: var(--wave3); color: var(--text); }
.admin-images { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0; }
.admin-images .thumb { position: relative; width: 76px; height: 76px; border-radius: 12px; overflow: hidden; }
.admin-images .thumb img { width: 100%; height: 100%; object-fit: cover; }
.admin-images .thumb .del { position: absolute; top: 2px; right: 2px; background: rgba(220,80,100,0.9); color: #fff; width: 22px; height: 22px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 0.75rem; }
.admin-login-err { color: #dc5064; font-size: 0.85rem; margin-bottom: 12px; display: none; }
</style>
</head>
<body>
<div class="disclaimer-overlay" id="dO"><div class="disclaimer-card"><h1>🌊 免责声明</h1><div class="content">[此处为免责声明内容]</div><div class="disclaimer-btns"><button class="btn btn-primary" onclick="A()">同意</button><button class="btn btn-ghost" onclick="D()">不同意</button></div></div></div>
<header class="app-header" id="aH" style="display:none"><div class="logo">🌊 学图分享</div><button class="back-btn" id="bB" onclick="GB()" style="display:none">← 返回</button></header>
<main><div class="page active" id="pS"><h2 class="page-title">知识海洋</h2><p class="page-subtitle">选择一个科目，扬帆起航</p><div class="subject-list" id="sL"></div></div>
<div class="page" id="pP"><h2 class="page-title" id="pT"></h2><p class="page-subtitle">选择一期探索</p><div class="period-grid" id="pG"></div></div>
<div class="page" id="pI"><h2 class="page-title" id="iT"></h2><p class="page-subtitle">点击图片放大查看</p><div class="image-grid" id="iG"></div><div class="no-images" id="nI" style="display:none">🐚 这里还没有珍珠哦~</div></div></main>
<div class="admin-entry"><a href="javascript:void(0)" onclick="OA()">⚓ 管理入口</a></div>
<div class="admin-modal" id="aLM"><div class="admin-panel"><h2>管理员登录</h2><label>用户名</label><input type="text" id="aU" placeholder="admin"><label>密码</label><input type="password" id="aP" placeholder="123456"><p class="admin-login-err" id="aLE">用户名或密码错误</p><button class="btn btn-primary" onclick="aL()" style="width:100%;margin-bottom:8px">登录</button><button class="btn btn-ghost" onclick="cL()" style="width:100%">取消</button></div></div>
<div class="admin-modal" id="aPM"><div class="admin-panel"><h2>📸 图片管理</h2><label>科目</label><select id="aS"></select><label>期数</label><input type="number" id="aPe" min="1" max="17" value="1"><button class="btn btn-primary" onclick="LA()" style="width:100%;margin-bottom:12px">查看图片</button><label>上传图片</label><input type="file" id="aF" accept="image/*" multiple onchange="UI()"><div class="admin-images" id="aI"></div><button class="btn btn-ghost" onclick="cP()" style="width:100%;margin-top:8px">关闭</button></div></div>
<div class="lightbox" id="lb" onclick="cLb()"><span class="lightbox-close">×</span><img id="lbI" src="" alt=""></div>
<script>const S=['语文','数学','英语','物理','化学','生物'],T=17,K='learning_share_images';let cs='',cp=0,st=[];function A(){localStorage.setItem('learning_share_agreed','1');document.getElementById('dO').style.display='none';document.getElementById('aH').style.display='flex';I();}function D(){alert('您必须同意免责声明才能使用本站。');}function SP(id){document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));document.getElementById(id).classList.add('active');}function GB(){if(st.length>0){let p=st.pop();if(p.page==='subjects'){SP('pS');document.getElementById('bB').style.display='none';}else SP('pP');}if(st.length===0)document.getElementById('bB').style.display='none';}function GIM(){try{return JSON.parse(localStorage.getItem(K))||{};}catch(e){return{};}}function SId(d){localStorage.setItem(K,JSON.stringify(d));}function GSI(s,p){let d=GIM();return d[s+'_'+p]||[];}function AIM(s,p,b){let d=GIM(),k=s+'_'+p;if(!d[k])d[k]=[];d[k].push(b);SId(d);}function RIM(s,p,i){let d=GIM(),k=s+'_'+p;if(d[k]){d[k].splice(i,1);if(!d[k].length)delete d[k];SId(d);}}function I(){document.getElementById('sL').innerHTML=S.map(s=>`<div class="subject-card" onclick="OS('${s}')"><div class="subject-icon">${s[0]}</div><div class="subject-name">${s}</div></div>`).join('');}function OS(s){cs=s;st.push({page:'subjects'});document.getElementById('bB').style.display='inline-block';document.getElementById('pT').textContent=s;SP('pP');IP();}function IP(){let h='';for(let i=1;i<=T;i++)h+=`<div class="period-item" onclick="OP(${i})">${i}</div>`;document.getElementById('pG').innerHTML=h;}function OP(p){cp=p;st.push({page:'periods'});document.getElementById('iT').textContent=cs+' · 第 '+p+' 期';SP('pI');LI();}function LI(){let imgs=GSI(cs,cp),g=document.getElementById('iG'),n=document.getElementById('nI');if(!imgs.length){g.innerHTML='';n.style.display='block';}else{n.style.display='none';g.innerHTML=imgs.map((img,i)=>`<img src="${img}" onclick="event.stopPropagation();OL('${img}')">`).join('');}}function OL(src){document.getElementById('lbI').src=src;document.getElementById('lb').classList.add('active');}function cLb(){document.getElementById('lb').classList.remove('active');}function OA(){document.getElementById('aLM').classList.add('active');document.getElementById('aLE').style.display='none';}function cL(){document.getElementById('aLM').classList.remove('active');}function aL(){if(document.getElementById('aU').value.trim()==='admin'&&document.getElementById('aP').value.trim()==='123456'){cL();OPa();}else document.getElementById('aLE').style.display='block';}function OPa(){document.getElementById('aS').innerHTML=S.map(s=>`<option value="${s}">${s}</option>`).join('');document.getElementById('aPe').value=1;document.getElementById('aPM').classList.add('active');LA();}function cP(){document.getElementById('aPM').classList.remove('active');}function LA(){let s=document.getElementById('aS').value,p=parseInt(document.getElementById('aPe').value),imgs=GSI(s,p);document.getElementById('aI').innerHTML=imgs.map((img,i)=>`<div class="thumb"><img src="${img}"><span class="del" onclick="DA('${s}',${p},${i})">×</span></div>`).join('');if(s===cs&&p===cp)LI();}function DA(s,p,i){if(!confirm('确定删除？'))return;RIM(s,p,i);LA();}function UI(){let s=document.getElementById('aS').value,p=parseInt(document.getElementById('aPe').value),files=document.getElementById('aF').files,pr=0;for(let f of files){let r=new FileReader();r.onload=function(e){AIM(s,p,e.target.result);pr++;if(pr===files.length){LA();document.getElementById('aF').value='';}};r.readAsDataURL(f);}}document.addEventListener('keydown',e=>{if(e.key==='Escape'){cLb();cL();cP();}});if(localStorage.getItem('learning_share_agreed')==='1')A();</script>
</body>
</html>
