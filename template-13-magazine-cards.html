<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>学图分享 · 杂志卡片</title>
<style>
/* ===== 杂志卡片 — Magazine Cards ===== */
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;0,900;1,500&family=Noto+Sans+SC:wght@300;400;500;700&display=swap');
:root {
  --font-display: 'Playfair Display', 'Noto Serif SC', 'Georgia', serif;
  --font-body: 'Noto Sans SC', 'Inter', 'PingFang SC', sans-serif;
  --bg: #f5f0eb; --surface: #ffffff; --border: #e0d8cf;
  --text: #2c2416; --text-secondary: #8c8068;
  --accent: #c0392b; --accent-hover: #a93226;
  --gold: #b8935a;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: var(--font-body); min-height: 100vh; line-height: 1.8; background: var(--bg); color: var(--text); }
.disclaimer-overlay { position: fixed; inset: 0; z-index: 9999; background: var(--bg); display: flex; align-items: center; justify-content: center; }
.disclaimer-card {
  max-width: 500px; width: 90%; padding: 56px 44px; text-align: center;
  background: var(--surface); box-shadow: 0 2px 20px rgba(0,0,0,0.06);
  position: relative;
}
.disclaimer-card::before { content: ''; position: absolute; top: 16px; left: 16px; right: 16px; bottom: 16px; border: 1px solid var(--border); pointer-events: none; }
.disclaimer-card h1 { font-family: var(--font-display); font-size: 2rem; font-weight: 900; margin-bottom: 24px; letter-spacing: 0.08em; font-style: italic; }
.disclaimer-card .content { font-size: 0.9rem; color: var(--text-secondary); line-height: 2; margin-bottom: 32px; padding: 24px; background: var(--bg); }
.disclaimer-btns { display: flex; gap: 12px; justify-content: center; }
.btn { padding: 12px 36px; font-size: 0.9rem; cursor: pointer; border: none; font-family: var(--font-body); transition: all 0.3s; font-weight: 500; letter-spacing: 0.04em; }
.btn-primary { background: var(--accent); color: #fff; text-transform: uppercase; letter-spacing: 0.1em; }
.btn-primary:hover { background: var(--accent-hover); }
.btn-ghost { background: transparent; border: 1px solid var(--border); color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.1em; }
.btn-ghost:hover { background: var(--bg); }
.app-header { padding: 20px 32px; display: flex; align-items: center; justify-content: space-between; background: var(--surface); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 100; }
.app-header .logo { font-family: var(--font-display); font-size: 1.4rem; font-weight: 900; font-style: italic; }
.app-header .logo span { color: var(--accent); }
.back-btn { background: none; border: none; padding: 6px 0; cursor: pointer; font-size: 0.85rem; color: var(--text-secondary); font-family: var(--font-body); text-transform: uppercase; letter-spacing: 0.08em; border-bottom: 1px solid transparent; }
.back-btn:hover { color: var(--text); border-bottom-color: var(--text); }
.page { display: none; max-width: 900px; margin: 0 auto; padding: 40px 24px; }
.page.active { display: block; }
.page-title { font-family: var(--font-display); font-size: 2.4rem; font-weight: 900; margin-bottom: 4px; font-style: italic; letter-spacing: 0.04em; }
.page-subtitle { color: var(--text-secondary); font-size: 0.85rem; margin-bottom: 36px; text-transform: uppercase; letter-spacing: 0.12em; font-weight: 300; }
.subject-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px; }
.subject-card {
  background: var(--surface); cursor: pointer; transition: all 0.3s;
  box-shadow: 0 1px 4px rgba(0,0,0,0.04); position: relative; overflow: hidden;
}
.subject-card:hover { box-shadow: 0 8px 32px rgba(0,0,0,0.1); }
.subject-card-inner { padding: 32px 24px; display: flex; align-items: center; gap: 16px; }
.subject-card::after { content: ''; position: absolute; top: 0; left: 0; width: 4px; height: 100%; background: var(--accent); opacity: 0; transition: opacity 0.3s; }
.subject-card:hover::after { opacity: 1; }
.subject-icon { width: 56px; height: 56px; background: var(--bg); display: flex; align-items: center; justify-content: center; font-size: 1.6rem; font-weight: 700; flex-shrink: 0; font-family: var(--font-display); font-style: italic; color: var(--accent); }
.subject-name { font-size: 1.15rem; font-weight: 500; letter-spacing: 0.04em; }
.subject-arrow { margin-left: auto; color: var(--text-secondary); font-size: 1.2rem; }
.period-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); gap: 12px; }
.period-item {
  aspect-ratio: 1; background: var(--surface); display: flex; align-items: center; justify-content: center;
  cursor: pointer; font-size: 1.2rem; font-weight: 500; transition: all 0.3s;
  font-family: var(--font-display); box-shadow: 0 1px 4px rgba(0,0,0,0.04);
}
.period-item:hover { background: var(--accent); color: #fff; }
.image-grid { columns: 3 220px; column-gap: 16px; }
.image-grid img { width: 100%; margin-bottom: 16px; cursor: pointer; transition: transform 0.3s; display: block; }
.image-grid img:hover { transform: scale(1.02); }
.no-images { text-align: center; padding: 80px 20px; color: var(--text-secondary); font-style: italic; }
.lightbox { display: none; position: fixed; inset: 0; z-index: 9998; background: rgba(28,24,16,0.94); align-items: center; justify-content: center; cursor: pointer; }
.lightbox.active { display: flex; } .lightbox img { max-width: 90vw; max-height: 88vh; object-fit: contain; }
.lightbox-close { position: absolute; top: 24px; right: 24px; color: #fff; font-size: 2rem; cursor: pointer; width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; font-family: var(--font-display); }
.admin-entry { text-align: center; padding: 48px 20px; } .admin-entry a { color: var(--text-secondary); font-size: 0.75rem; text-decoration: none; text-transform: uppercase; letter-spacing: 0.15em; opacity: 0.4; } .admin-entry a:hover { opacity: 1; }
.admin-modal { display: none; position: fixed; inset: 0; z-index: 9997; background: rgba(28,24,16,0.5); align-items: center; justify-content: center; }
.admin-modal.active { display: flex; }
.admin-panel { background: var(--surface); padding: 40px; width: 90%; max-width: 500px; max-height: 85vh; overflow-y: auto; }
.admin-panel h2 { font-family: var(--font-display); font-size: 1.6rem; font-style: italic; margin-bottom: 28px; font-weight: 900; }
.admin-panel label { display: block; font-size: 0.8rem; margin-bottom: 4px; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.1em; }
.admin-panel select, .admin-panel input { width: 100%; padding: 12px; border: 1px solid var(--border); font-size: 0.9rem; margin-bottom: 20px; font-family: var(--font-body); background: var(--bg); color: var(--text); }
.admin-images { display: flex; flex-wrap: wrap; gap: 8px; margin: 16px 0; }
.admin-images .thumb { position: relative; width: 80px; height: 80px; overflow: hidden; }
.admin-images .thumb img { width: 100%; height: 100%; object-fit: cover; }
.admin-images .thumb .del { position: absolute; top: 3px; right: 3px; background: var(--accent); color: #fff; width: 22px; height: 22px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 0.75rem; }
.admin-login-err { color: var(--accent); font-size: 0.8rem; margin-bottom: 16px; display: none; }
</style>
</head>
<body>
<div class="disclaimer-overlay" id="dO"><div class="disclaimer-card"><h1>Disclaimer</h1><div class="content">[此处为免责声明内容]</div><div class="disclaimer-btns"><button class="btn btn-primary" onclick="A()">同意</button><button class="btn btn-ghost" onclick="D()">不同意</button></div></div></div>
<header class="app-header" id="aH" style="display:none"><div class="logo"><span>Study</span> Share</div><button class="back-btn" id="bB" onclick="GB()" style="display:none">← Back</button></header>
<main><div class="page active" id="pS"><h2 class="page-title">Subjects.</h2><p class="page-subtitle">Curated Collections</p><div class="subject-list" id="sL"></div></div>
<div class="page" id="pP"><h2 class="page-title" id="pT"></h2><p class="page-subtitle">Select Issue</p><div class="period-grid" id="pG"></div></div>
<div class="page" id="pI"><h2 class="page-title" id="iT"></h2><p class="page-subtitle">Click to enlarge</p><div class="image-grid" id="iG"></div><div class="no-images" id="nI" style="display:none">No images yet.</div></div></main>
<div class="admin-entry"><a href="javascript:void(0)" onclick="OA()">Admin</a></div>
<div class="admin-modal" id="aLM"><div class="admin-panel"><h2>Admin Login</h2><label>Username</label><input type="text" id="aU" placeholder="admin"><label>Password</label><input type="password" id="aP" placeholder="123456"><p class="admin-login-err" id="aLE">Invalid credentials</p><button class="btn btn-primary" onclick="aL()" style="width:100%;margin-bottom:8px">Sign In</button><button class="btn btn-ghost" onclick="cL()" style="width:100%">Cancel</button></div></div>
<div class="admin-modal" id="aPM"><div class="admin-panel"><h2>Image Manager</h2><label>Subject</label><select id="aS"></select><label>Period</label><input type="number" id="aPe" min="1" max="17" value="1"><button class="btn btn-primary" onclick="LA()" style="width:100%;margin-bottom:12px">View Images</button><label>Upload</label><input type="file" id="aF" accept="image/*" multiple onchange="UI()"><div class="admin-images" id="aI"></div><button class="btn btn-ghost" onclick="cP()" style="width:100%;margin-top:8px">Close</button></div></div>
<div class="lightbox" id="lb" onclick="cLb()"><span class="lightbox-close">×</span><img id="lbI" src="" alt=""></div>
<script>const S=['语文','数学','英语','物理','化学','生物'],T=17,K='learning_share_images';let cs='',cp=0,st=[];function A(){localStorage.setItem('learning_share_agreed','1');document.getElementById('dO').style.display='none';document.getElementById('aH').style.display='flex';I();}function D(){alert('您必须同意免责声明才能使用本站。');}function SP(id){document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));document.getElementById(id).classList.add('active');}function GB(){if(st.length>0){let p=st.pop();if(p.page==='subjects'){SP('pS');document.getElementById('bB').style.display='none';}else SP('pP');}if(st.length===0)document.getElementById('bB').style.display='none';}function GIM(){try{return JSON.parse(localStorage.getItem(K))||{};}catch(e){return{};}}function SId(d){localStorage.setItem(K,JSON.stringify(d));}function GSI(s,p){let d=GIM();return d[s+'_'+p]||[];}function AIM(s,p,b){let d=GIM(),k=s+'_'+p;if(!d[k])d[k]=[];d[k].push(b);SId(d);}function RIM(s,p,i){let d=GIM(),k=s+'_'+p;if(d[k]){d[k].splice(i,1);if(!d[k].length)delete d[k];SId(d);}}function I(){document.getElementById('sL').innerHTML=S.map(s=>`<div class="subject-card" onclick="OS('${s}')"><div class="subject-card-inner"><div class="subject-icon">${s[0]}</div><span class="subject-name">${s}</span><span class="subject-arrow">→</span></div></div>`).join('');}function OS(s){cs=s;st.push({page:'subjects'});document.getElementById('bB').style.display='inline-block';document.getElementById('pT').textContent=s;SP('pP');IP();}function IP(){let h='';for(let i=1;i<=T;i++)h+=`<div class="period-item" onclick="OP(${i})">${i}</div>`;document.getElementById('pG').innerHTML=h;}function OP(p){cp=p;st.push({page:'periods'});document.getElementById('iT').textContent=cs+' · No. '+p;SP('pI');LI();}function LI(){let imgs=GSI(cs,cp),g=document.getElementById('iG'),n=document.getElementById('nI');if(!imgs.length){g.innerHTML='';n.style.display='block';}else{n.style.display='none';g.innerHTML=imgs.map((img,i)=>`<img src="${img}" onclick="event.stopPropagation();OL('${img}')">`).join('');}}function OL(src){document.getElementById('lbI').src=src;document.getElementById('lb').classList.add('active');}function cLb(){document.getElementById('lb').classList.remove('active');}function OA(){document.getElementById('aLM').classList.add('active');document.getElementById('aLE').style.display='none';}function cL(){document.getElementById('aLM').classList.remove('active');}function aL(){if(document.getElementById('aU').value.trim()==='admin'&&document.getElementById('aP').value.trim()==='123456'){cL();OPa();}else document.getElementById('aLE').style.display='block';}function OPa(){document.getElementById('aS').innerHTML=S.map(s=>`<option value="${s}">${s}</option>`).join('');document.getElementById('aPe').value=1;document.getElementById('aPM').classList.add('active');LA();}function cP(){document.getElementById('aPM').classList.remove('active');}function LA(){let s=document.getElementById('aS').value,p=parseInt(document.getElementById('aPe').value),imgs=GSI(s,p);document.getElementById('aI').innerHTML=imgs.map((img,i)=>`<div class="thumb"><img src="${img}"><span class="del" onclick="DA('${s}',${p},${i})">×</span></div>`).join('');if(s===cs&&p===cp)LI();}function DA(s,p,i){if(!confirm('确定删除？'))return;RIM(s,p,i);LA();}function UI(){let s=document.getElementById('aS').value,p=parseInt(document.getElementById('aPe').value),files=document.getElementById('aF').files,pr=0;for(let f of files){let r=new FileReader();r.onload=function(e){AIM(s,p,e.target.result);pr++;if(pr===files.length){LA();document.getElementById('aF').value='';}};r.readAsDataURL(f);}}document.addEventListener('keydown',e=>{if(e.key==='Escape'){cLb();cL();cP();}});if(localStorage.getItem('learning_share_agreed')==='1')A();</script>
</body>
</html>
