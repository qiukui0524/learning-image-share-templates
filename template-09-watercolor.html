<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>学图分享 · 手绘水彩</title>
<style>
/* ===== 手绘水彩 — Watercolor ===== */
@import url('https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Noto+Serif+SC:wght@400;600&display=swap');
:root {
  --font-title: 'ZCOOL KuaiLe', 'Noto Serif SC', cursive;
  --font-body: 'Noto Serif SC', 'STKaiti', 'KaiTi', serif;
  --pink: #f8d7da; --blue: #d4e6f1; --yellow: #fef9e7; --green: #d5f0e2; --purple: #e8daef;
  --text: #5d4e6d; --text-secondary: #9b8ea8;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: var(--font-body); min-height: 100vh; line-height: 1.8;
  background: #fdf6f0;
  background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M30 5 Q35 15 25 20' stroke='%23e8ddd0' fill='none' stroke-width='0.5'/%3E%3C/svg%3E");
  color: var(--text);
}
.disclaimer-overlay { position: fixed; inset: 0; z-index: 9999; background: #fdf6f0; display: flex; align-items: center; justify-content: center; }
.disclaimer-card {
  max-width: 460px; width: 90%; padding: 44px 36px; text-align: center;
  background: #fffefb; border-radius: 24px;
  box-shadow: 0 8px 32px rgba(139,119,160,0.1);
  border: 2px solid #f0e8f6;
  position: relative;
}
.disclaimer-card::before { content: '🌸'; position: absolute; top: -20px; left: 50%; transform: translateX(-50%); font-size: 2rem; }
.disclaimer-card h1 { font-family: var(--font-title); font-size: 1.8rem; margin-bottom: 16px; color: #8b6b9e; }
.disclaimer-card .content { font-size: 0.9rem; color: var(--text-secondary); margin-bottom: 28px; padding: 20px; background: #fdf6fd; border-radius: 16px; border: 1px dashed #e8d8f0; }
.disclaimer-btns { display: flex; gap: 12px; justify-content: center; }
.btn { padding: 10px 32px; border-radius: 20px; font-size: 0.95rem; cursor: pointer; border: none; font-family: var(--font-body); transition: all 0.3s; }
.btn-primary { background: #d4b8e8; color: #4a3060; box-shadow: 0 3px 0 #b89ad0; }
.btn-primary:hover { background: #c9a8e0; transform: translateY(-1px); box-shadow: 0 4px 0 #b89ad0; }
.btn-ghost { background: #fff; border: 2px solid #e8d8f0; color: var(--text-secondary); }
.btn-ghost:hover { background: #fdf6fd; }
.app-header { padding: 16px 24px; display: flex; align-items: center; justify-content: space-between; background: #fffefb; border-bottom: 2px dashed #e8d8f0; position: sticky; top: 0; z-index: 100; }
.app-header .logo { font-family: var(--font-title); font-size: 1.3rem; color: #8b6b9e; }
.back-btn { background: #fff; border: 2px solid #e8d8f0; padding: 6px 18px; border-radius: 16px; cursor: pointer; font-size: 0.85rem; color: var(--text-secondary); font-family: var(--font-body); }
.back-btn:hover { background: #fdf6fd; }
.page { display: none; max-width: 780px; margin: 0 auto; padding: 32px 20px; }
.page.active { display: block; }
.page-title { font-family: var(--font-title); font-size: 1.6rem; margin-bottom: 6px; color: #8b6b9e; }
.page-subtitle { color: var(--text-secondary); font-size: 0.9rem; margin-bottom: 24px; }
.subject-list { display: flex; flex-direction: column; gap: 10px; }
.subject-card {
  background: #fffefb; border-radius: 18px; padding: 18px 20px; cursor: pointer;
  display: flex; align-items: center; gap: 14px; transition: all 0.3s;
  border: 2px solid #f0e8f6; box-shadow: 0 2px 8px rgba(139,119,160,0.06);
}
.subject-card:hover { border-color: #d4b8e8; transform: translateX(4px); }
.subject-icon {
  width: 50px; height: 50px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
  font-size: 1.3rem; color: #fff; font-family: var(--font-title); flex-shrink: 0;
}
.subject-card:nth-child(1) .subject-icon { background: #f0b8c8; }
.subject-card:nth-child(2) .subject-icon { background: #b8cce8; }
.subject-card:nth-child(3) .subject-icon { background: #f0d8a0; }
.subject-card:nth-child(4) .subject-icon { background: #a0d8c0; }
.subject-card:nth-child(5) .subject-icon { background: #c8b0e0; }
.subject-card:nth-child(6) .subject-icon { background: #e0c8b0; }
.subject-name { font-size: 1.05rem; } .subject-arrow { margin-left: auto; color: #c8b8d8; }
.period-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(68px, 1fr)); gap: 10px; }
.period-item {
  aspect-ratio: 1; border-radius: 50%; display: flex; align-items: center; justify-content: center;
  cursor: pointer; font-size: 1rem; transition: all 0.3s;
  background: #fffefb; border: 2px solid #f0e8f6;
}
.period-item:hover { background: #f8e8ff; border-color: #d4b8e8; transform: scale(1.08); }
.image-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 14px; }
.image-grid img { width: 100%; aspect-ratio: 3/4; object-fit: cover; border-radius: 18px; cursor: pointer; transition: transform 0.3s; border: 3px solid #fff; box-shadow: 0 4px 16px rgba(139,119,160,0.1); }
.image-grid img:hover { transform: rotate(-1deg) scale(1.04); }
.no-images { text-align: center; padding: 60px 20px; color: var(--text-secondary); font-family: var(--font-title); }
.lightbox { display: none; position: fixed; inset: 0; z-index: 9998; background: rgba(93,78,109,0.92); align-items: center; justify-content: center; cursor: pointer; }
.lightbox.active { display: flex; } .lightbox img { max-width: 92vw; max-height: 90vh; border-radius: 20px; object-fit: contain; }
.lightbox-close { position: absolute; top: 20px; right: 20px; color: #fff; font-size: 2rem; cursor: pointer; width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; font-family: var(--font-title); }
.admin-entry { text-align: center; padding: 40px 20px; } .admin-entry a { color: var(--text-secondary); font-size: 0.8rem; text-decoration: none; opacity: 0.5; } .admin-entry a:hover { opacity: 1; }
.admin-modal { display: none; position: fixed; inset: 0; z-index: 9997; background: rgba(93,78,109,0.3); align-items: center; justify-content: center; }
.admin-modal.active { display: flex; }
.admin-panel { background: #fffefb; border-radius: 24px; padding: 32px; width: 90%; max-width: 480px; max-height: 85vh; overflow-y: auto; border: 2px solid #f0e8f6; box-shadow: 0 8px 40px rgba(139,119,160,0.15); }
.admin-panel h2 { font-family: var(--font-title); font-size: 1.3rem; margin-bottom: 20px; color: #8b6b9e; }
.admin-panel label { display: block; font-size: 0.85rem; margin-bottom: 4px; color: var(--text-secondary); }
.admin-panel select, .admin-panel input { width: 100%; padding: 10px 14px; border: 2px solid #f0e8f6; border-radius: 14px; font-size: 0.9rem; margin-bottom: 16px; font-family: var(--font-body); background: #fdf6fd; color: var(--text); }
.admin-images { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0; }
.admin-images .thumb { position: relative; width: 76px; height: 76px; border-radius: 12px; overflow: hidden; border: 2px solid #f0e8f6; }
.admin-images .thumb img { width: 100%; height: 100%; object-fit: cover; }
.admin-images .thumb .del { position: absolute; top: 2px; right: 2px; background: rgba(200,80,100,0.9); color: #fff; width: 22px; height: 22px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 0.75rem; }
.admin-login-err { color: #c85064; font-size: 0.85rem; margin-bottom: 12px; display: none; }
</style>
</head>
<body>
<div class="disclaimer-overlay" id="dO"><div class="disclaimer-card"><h1>免责声明</h1><div class="content">[此处为免责声明内容]</div><div class="disclaimer-btns"><button class="btn btn-primary" onclick="A()">同意</button><button class="btn btn-ghost" onclick="D()">不同意</button></div></div></div>
<header class="app-header" id="aH" style="display:none"><div class="logo">🌸 学图分享</div><button class="back-btn" id="bB" onclick="GB()" style="display:none">← 返回</button></header>
<main><div class="page active" id="pS"><h2 class="page-title">科目小花园</h2><p class="page-subtitle">选一朵花，开始探索吧~</p><div class="subject-list" id="sL"></div></div>
<div class="page" id="pP"><h2 class="page-title" id="pT"></h2><p class="page-subtitle">选一期查看</p><div class="period-grid" id="pG"></div></div>
<div class="page" id="pI"><h2 class="page-title" id="iT"></h2><p class="page-subtitle">点击图片放大</p><div class="image-grid" id="iG"></div><div class="no-images" id="nI" style="display:none">🌱 这里还没有小花开哦~</div></div></main>
<div class="admin-entry"><a href="javascript:void(0)" onclick="OA()">🌿 管理入口</a></div>
<div class="admin-modal" id="aLM"><div class="admin-panel"><h2>管理员登录</h2><label>用户名</label><input type="text" id="aU" placeholder="admin"><label>密码</label><input type="password" id="aP" placeholder="123456"><p class="admin-login-err" id="aLE">用户名或密码错误</p><button class="btn btn-primary" onclick="aL()" style="width:100%;margin-bottom:8px">登录</button><button class="btn btn-ghost" onclick="cL()" style="width:100%">取消</button></div></div>
<div class="admin-modal" id="aPM"><div class="admin-panel"><h2>📸 图片管理</h2><label>科目</label><select id="aS"></select><label>期数</label><input type="number" id="aPe" min="1" max="17" value="1"><button class="btn btn-primary" onclick="LA()" style="width:100%;margin-bottom:12px">查看图片</button><label>上传图片</label><input type="file" id="aF" accept="image/*" multiple onchange="UI()"><div class="admin-images" id="aI"></div><button class="btn btn-ghost" onclick="cP()" style="width:100%;margin-top:8px">关闭</button></div></div>
<div class="lightbox" id="lb" onclick="cLb()"><span class="lightbox-close">✕</span><img id="lbI" src="" alt=""></div>
<script>
const S=['语文','数学','英语','物理','化学','生物'],T=17,K='learning_share_images';let cs='',cp=0,st=[];
function A(){localStorage.setItem('learning_share_agreed','1');document.getElementById('dO').style.display='none';document.getElementById('aH').style.display='flex';I();}
function D(){alert('您必须同意免责声明才能使用本站。');}
function SP(id){document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));document.getElementById(id).classList.add('active');}
function GB(){if(st.length>0){let p=st.pop();if(p.page==='subjects'){SP('pS');document.getElementById('bB').style.display='none';}else SP('pP');}if(st.length===0)document.getElementById('bB').style.display='none';}
function GIM(){try{return JSON.parse(localStorage.getItem(K))||{};}catch(e){return{};}}
function SId(d){localStorage.setItem(K,JSON.stringify(d));}
function GSI(s,p){let d=GIM();return d[s+'_'+p]||[];}
function AIM(s,p,b){let d=GIM(),k=s+'_'+p;if(!d[k])d[k]=[];d[k].push(b);SId(d);}
function RIM(s,p,i){let d=GIM(),k=s+'_'+p;if(d[k]){d[k].splice(i,1);if(!d[k].length)delete d[k];SId(d);}}
function I(){document.getElementById('sL').innerHTML=S.map(s=>`<div class="subject-card" onclick="OS('${s}')"><div class="subject-icon">${s[0]}</div><span class="subject-name">${s}</span><span class="subject-arrow">❀</span></div>`).join('');}
function OS(s){cs=s;st.push({page:'subjects'});document.getElementById('bB').style.display='inline-block';document.getElementById('pT').textContent=s;SP('pP');IP();}
function IP(){let h='';for(let i=1;i<=T;i++)h+=`<div class="period-item" onclick="OP(${i})">${i}</div>`;document.getElementById('pG').innerHTML=h;}
function OP(p){cp=p;st.push({page:'periods'});document.getElementById('iT').textContent=cs+' · 第 '+p+' 期';SP('pI');LI();}
function LI(){let imgs=GSI(cs,cp),g=document.getElementById('iG'),n=document.getElementById('nI');if(!imgs.length){g.innerHTML='';n.style.display='block';}else{n.style.display='none';g.innerHTML=imgs.map((img,i)=>`<img src="${img}" alt="" onclick="event.stopPropagation();OL('${img}')">`).join('');}}
function OL(src){document.getElementById('lbI').src=src;document.getElementById('lb').classList.add('active');}
function cLb(){document.getElementById('lb').classList.remove('active');}
function OA(){document.getElementById('aLM').classList.add('active');document.getElementById('aLE').style.display='none';}
function cL(){document.getElementById('aLM').classList.remove('active');}
function aL(){if(document.getElementById('aU').value.trim()==='admin'&&document.getElementById('aP').value.trim()==='123456'){cL();OPa();}else document.getElementById('aLE').style.display='block';}
function OPa(){document.getElementById('aS').innerHTML=S.map(s=>`<option value="${s}">${s}</option>`).join('');document.getElementById('aPe').value=1;document.getElementById('aPM').classList.add('active');LA();}
function cP(){document.getElementById('aPM').classList.remove('active');}
function LA(){let s=document.getElementById('aS').value,p=parseInt(document.getElementById('aPe').value),imgs=GSI(s,p);document.getElementById('aI').innerHTML=imgs.map((img,i)=>`<div class="thumb"><img src="${img}"><span class="del" onclick="DA('${s}',${p},${i})">×</span></div>`).join('');if(s===cs&&p===cp)LI();}
function DA(s,p,i){if(!confirm('确定删除？'))return;RIM(s,p,i);LA();}
function UI(){let s=document.getElementById('aS').value,p=parseInt(document.getElementById('aPe').value),files=document.getElementById('aF').files,pr=0;for(let f of files){let r=new FileReader();r.onload=function(e){AIM(s,p,e.target.result);pr++;if(pr===files.length){LA();document.getElementById('aF').value='';}};r.readAsDataURL(f);}}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){cLb();cL();cP();}});
if(localStorage.getItem('learning_share_agreed')==='1')A();
</script>
</body>
</html>
