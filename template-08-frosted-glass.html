<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>学图分享 · 磨砂玻璃</title>
<style>
/* ===== 磨砂玻璃 — Frosted Glass ===== */
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Noto+Sans+SC:wght@300;400;500&display=swap');
:root {
  --font: 'Inter', 'Noto Sans SC', 'PingFang SC', sans-serif;
  --text: #2d2d3f; --text-secondary: #7c7c9a;
  --accent: #6c5ce7; --accent-hover: #5a4bd1;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: var(--font); min-height: 100vh; line-height: 1.6;
  background: linear-gradient(135deg, #e8e0f0 0%, #dce8f5 25%, #f0e6f6 50%, #e0e8f5 75%, #f0e8e0 100%);
  background-attachment: fixed;
  color: var(--text);
}
body::before {
  content: ''; position: fixed; inset: 0;
  background: radial-gradient(circle at 20% 30%, rgba(255,255,255,0.4) 0%, transparent 50%),
              radial-gradient(circle at 80% 70%, rgba(200,180,255,0.3) 0%, transparent 50%),
              radial-gradient(circle at 50% 50%, rgba(180,210,255,0.3) 0%, transparent 50%);
  pointer-events: none; z-index: 0;
}
.disclaimer-overlay { position: fixed; inset: 0; z-index: 9999; display: flex; align-items: center; justify-content: center; }
.disclaimer-card {
  max-width: 480px; width: 90%; padding: 48px 36px; text-align: center;
  background: rgba(255,255,255,0.55); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  border-radius: 24px; border: 1px solid rgba(255,255,255,0.6);
  box-shadow: 0 8px 32px rgba(0,0,0,0.06), 0 2px 8px rgba(0,0,0,0.04);
  position: relative; z-index: 1;
}
.disclaimer-card h1 { font-size: 1.5rem; font-weight: 500; margin-bottom: 20px; color: var(--text); }
.disclaimer-card .content { font-size: 0.9rem; color: var(--text-secondary); line-height: 1.8; margin-bottom: 32px; padding: 20px; background: rgba(255,255,255,0.4); border-radius: 16px; }
.disclaimer-btns { display: flex; gap: 12px; justify-content: center; }
.btn { padding: 10px 28px; border-radius: 12px; font-size: 0.9rem; cursor: pointer; border: none; font-family: var(--font); transition: all 0.25s; font-weight: 500; }
.btn-primary { background: var(--accent); color: #fff; backdrop-filter: blur(10px); }
.btn-primary:hover { background: var(--accent-hover); transform: translateY(-1px); box-shadow: 0 4px 16px rgba(108,92,231,0.3); }
.btn-ghost { background: rgba(255,255,255,0.4); border: 1px solid rgba(255,255,255,0.5); color: var(--text-secondary); backdrop-filter: blur(10px); }
.btn-ghost:hover { background: rgba(255,255,255,0.6); }
.app-header {
  padding: 16px 24px; display: flex; align-items: center; justify-content: space-between;
  background: rgba(255,255,255,0.5); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  border-bottom: 1px solid rgba(255,255,255,0.6); position: sticky; top: 0; z-index: 100;
}
.app-header .logo { font-size: 1.15rem; font-weight: 600; color: var(--text); }
.app-header .logo span { color: var(--accent); }
.back-btn { background: rgba(255,255,255,0.4); border: 1px solid rgba(255,255,255,0.5); padding: 6px 16px; border-radius: 10px; cursor: pointer; font-size: 0.85rem; color: var(--text-secondary); font-family: var(--font); backdrop-filter: blur(10px); }
.back-btn:hover { background: rgba(255,255,255,0.6); }
.page { display: none; max-width: 800px; margin: 0 auto; padding: 32px 20px; position: relative; z-index: 1; }
.page.active { display: block; }
.page-title { font-size: 1.6rem; margin-bottom: 6px; font-weight: 600; }
.page-subtitle { color: var(--text-secondary); font-size: 0.9rem; margin-bottom: 24px; }
.subject-list { display: flex; flex-direction: column; gap: 10px; }
.subject-card {
  background: rgba(255,255,255,0.45); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  border-radius: 16px; padding: 18px 22px; cursor: pointer;
  display: flex; align-items: center; gap: 16px; transition: all 0.25s;
  border: 1px solid rgba(255,255,255,0.5);
}
.subject-card:hover { background: rgba(255,255,255,0.65); transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,0.06); }
.subject-icon { width: 48px; height: 48px; background: rgba(108,92,231,0.15); border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 1.3rem; font-weight: 600; color: var(--accent); flex-shrink: 0; }
.subject-name { font-size: 1.05rem; font-weight: 500; }
.subject-arrow { margin-left: auto; color: var(--text-secondary); }
.period-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(72px, 1fr)); gap: 10px; }
.period-item {
  aspect-ratio: 1; background: rgba(255,255,255,0.45); backdrop-filter: blur(12px);
  border-radius: 14px; display: flex; align-items: center; justify-content: center;
  cursor: pointer; font-size: 1.05rem; font-weight: 500; transition: all 0.25s;
  border: 1px solid rgba(255,255,255,0.5);
}
.period-item:hover { background: rgba(108,92,231,0.2); border-color: var(--accent); color: var(--accent); transform: translateY(-2px); }
.image-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
.image-grid img { width: 100%; aspect-ratio: 3/4; object-fit: cover; border-radius: 16px; cursor: pointer; transition: transform 0.3s; box-shadow: 0 4px 16px rgba(0,0,0,0.08); }
.image-grid img:hover { transform: scale(1.04); }
.no-images { text-align: center; padding: 60px 20px; color: var(--text-secondary); }
.lightbox { display: none; position: fixed; inset: 0; z-index: 9998; background: rgba(0,0,0,0.85); backdrop-filter: blur(10px); align-items: center; justify-content: center; cursor: pointer; }
.lightbox.active { display: flex; } .lightbox img { max-width: 92vw; max-height: 90vh; border-radius: 12px; object-fit: contain; }
.lightbox-close { position: absolute; top: 20px; right: 20px; color: #fff; font-size: 2rem; cursor: pointer; width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; }
.admin-entry { text-align: center; padding: 40px 20px; } .admin-entry a { color: var(--text-secondary); font-size: 0.8rem; text-decoration: none; opacity: 0.5; } .admin-entry a:hover { opacity: 1; }
.admin-modal { display: none; position: fixed; inset: 0; z-index: 9997; background: rgba(0,0,0,0.3); backdrop-filter: blur(6px); align-items: center; justify-content: center; }
.admin-modal.active { display: flex; }
.admin-panel { background: rgba(255,255,255,0.7); backdrop-filter: blur(24px); border-radius: 20px; padding: 32px; width: 90%; max-width: 480px; max-height: 85vh; overflow-y: auto; border: 1px solid rgba(255,255,255,0.6); box-shadow: 0 8px 40px rgba(0,0,0,0.1); }
.admin-panel h2 { font-size: 1.2rem; margin-bottom: 20px; font-weight: 600; }
.admin-panel label { display: block; font-size: 0.85rem; margin-bottom: 4px; color: var(--text-secondary); }
.admin-panel select, .admin-panel input { width: 100%; padding: 10px 14px; border: 1px solid rgba(255,255,255,0.6); border-radius: 12px; font-size: 0.9rem; margin-bottom: 16px; font-family: var(--font); background: rgba(255,255,255,0.5); backdrop-filter: blur(8px); color: var(--text); }
.admin-images { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0; }
.admin-images .thumb { position: relative; width: 76px; height: 76px; border-radius: 10px; overflow: hidden; }
.admin-images .thumb img { width: 100%; height: 100%; object-fit: cover; }
.admin-images .thumb .del { position: absolute; top: 3px; right: 3px; background: rgba(220,38,38,0.9); color: #fff; width: 22px; height: 22px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 0.75rem; }
.admin-login-err { color: #dc2626; font-size: 0.85rem; margin-bottom: 12px; display: none; }
</style>
</head>
<body>
<div class="disclaimer-overlay" id="dO"><div class="disclaimer-card"><h1>免责声明</h1><div class="content">[此处为免责声明内容]</div><div class="disclaimer-btns"><button class="btn btn-primary" onclick="A()">同意</button><button class="btn btn-ghost" onclick="D()">不同意</button></div></div></div>
<header class="app-header" id="aH" style="display:none"><div class="logo">📖 学图<span>分享</span></div><button class="back-btn" id="bB" onclick="GB()" style="display:none">← 返回</button></header>
<main><div class="page active" id="pS"><h2 class="page-title">科目</h2><p class="page-subtitle">选择科目浏览学习图片</p><div class="subject-list" id="sL"></div></div>
<div class="page" id="pP"><h2 class="page-title" id="pT"></h2><p class="page-subtitle">选择一期查看</p><div class="period-grid" id="pG"></div></div>
<div class="page" id="pI"><h2 class="page-title" id="iT"></h2><p class="page-subtitle">点击图片放大查看</p><div class="image-grid" id="iG"></div><div class="no-images" id="nI" style="display:none">📭 该期暂无图片，请通过管理后台上传</div></div></main>
<div class="admin-entry"><a href="javascript:void(0)" onclick="OA()">管理入口</a></div>
<div class="admin-modal" id="aLM"><div class="admin-panel"><h2>管理员登录</h2><label>用户名</label><input type="text" id="aU" placeholder="admin"><label>密码</label><input type="password" id="aP" placeholder="123456"><p class="admin-login-err" id="aLE">用户名或密码错误</p><button class="btn btn-primary" onclick="aL()" style="width:100%;margin-bottom:8px">登录</button><button class="btn btn-ghost" onclick="cL()" style="width:100%">取消</button></div></div>
<div class="admin-modal" id="aPM"><div class="admin-panel"><h2>📁 图片管理</h2><label>科目</label><select id="aS"></select><label>期数</label><input type="number" id="aPe" min="1" max="17" value="1"><button class="btn btn-primary" onclick="LA()" style="width:100%;margin-bottom:12px">查看图片</button><label>上传图片</label><input type="file" id="aF" accept="image/*" multiple onchange="UI()"><div class="admin-images" id="aI"></div><button class="btn btn-ghost" onclick="cP()" style="width:100%;margin-top:8px">关闭</button></div></div>
<div class="lightbox" id="lb" onclick="cLb()"><span class="lightbox-close">&times;</span><img id="lbI" src="" alt=""></div>
<script>
const S=['语文','数学','英语','物理','化学','生物'],T=17,K='learning_share_images';let cs='',cp=0,st=[];
function A(){localStorage.setItem('learning_share_agreed','1');document.getElementById('dO').style.display='none';document.getElementById('aH').style.display='flex';I();}
function D(){alert('您必须同意免责声明才能使用本站。');}
function SP(id){document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));document.getElementById(id).classList.add('active');}
function GB(){if(st.length>0){let p=st.pop();if(p.page==='subjects'){SP('pS');document.getElementById('bB').style.display='none';}else SP('pP');}if(st.length===0)document.getElementById('bB').style.display='none';}
function GIM(){try{return JSON.parse(localStorage.getItem(K))||{};}catch(e){return{};}}
function SId(d){localStorage.setItem(K,JSON.stringify(d));}
function GSI(s,p){let d=GIM();return d[s+'_'+p]||[];}
function AIM(s,p,b){let d=GIM(),k=s+'_'+p;if(!d[k])d[k]=[];d[k].push(b);SId(d);}
function RIM(s,p,i){let d=GIM(),k=s+'_'+p;if(d[k]){d[k].splice(i,1);if(!d[k].length)delete d[k];SId(d);}}
function I(){document.getElementById('sL').innerHTML=S.map(s=>`<div class="subject-card" onclick="OS('${s}')"><div class="subject-icon">${s[0]}</div><span class="subject-name">${s}</span><span class="subject-arrow">›</span></div>`).join('');}
function OS(s){cs=s;st.push({page:'subjects'});document.getElementById('bB').style.display='inline-block';document.getElementById('pT').textContent=s;SP('pP');IP();}
function IP(){let h='';for(let i=1;i<=T;i++)h+=`<div class="period-item" onclick="OP(${i})">${i}</div>`;document.getElementById('pG').innerHTML=h;}
function OP(p){cp=p;st.push({page:'periods'});document.getElementById('iT').textContent=cs+' · 第 '+p+' 期';SP('pI');LI();}
function LI(){let imgs=GSI(cs,cp),g=document.getElementById('iG'),n=document.getElementById('nI');if(!imgs.length){g.innerHTML='';n.style.display='block';}else{n.style.display='none';g.innerHTML=imgs.map((img,i)=>`<img src="${img}" alt="" onclick="event.stopPropagation();OL('${img}')">`).join('');}}
function OL(src){document.getElementById('lbI').src=src;document.getElementById('lb').classList.add('active');}
function cLb(){document.getElementById('lb').classList.remove('active');}
function OA(){document.getElementById('aLM').classList.add('active');document.getElementById('aLE').style.display='none';}
function cL(){document.getElementById('aLM').classList.remove('active');}
function aL(){if(document.getElementById('aU').value.trim()==='admin'&&document.getElementById('aP').value.trim()==='123456'){cL();OPa();}else document.getElementById('aLE').style.display='block';}
function OPa(){document.getElementById('aS').innerHTML=S.map(s=>`<option value="${s}">${s}</option>`).join('');document.getElementById('aPe').value=1;document.getElementById('aPM').classList.add('active');LA();}
function cP(){document.getElementById('aPM').classList.remove('active');}
function LA(){let s=document.getElementById('aS').value,p=parseInt(document.getElementById('aPe').value),imgs=GSI(s,p);document.getElementById('aI').innerHTML=imgs.map((img,i)=>`<div class="thumb"><img src="${img}"><span class="del" onclick="DA('${s}',${p},${i})">×</span></div>`).join('');if(s===cs&&p===cp)LI();}
function DA(s,p,i){if(!confirm('确定删除？'))return;RIM(s,p,i);LA();}
function UI(){let s=document.getElementById('aS').value,p=parseInt(document.getElementById('aPe').value),files=document.getElementById('aF').files,pr=0;for(let f of files){let r=new FileReader();r.onload=function(e){AIM(s,p,e.target.result);pr++;if(pr===files.length){LA();document.getElementById('aF').value='';}};r.readAsDataURL(f);}}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){cLb();cL();cP();}});
if(localStorage.getItem('learning_share_agreed')==='1')A();
</script>
</body>
</html>
